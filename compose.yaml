services:
  commerce-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - commerce-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  commerce-migrations:
    image: redgate/flyway:13.10.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://commerce-db:5432/${POSTGRES_DB:-marketplace_commerce}
      FLYWAY_USER: ${POSTGRES_USER:-marketplace}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./services/commerce-service/migrations:/flyway/sql:ro
    depends_on:
      commerce-db:
        condition: service_healthy
    restart: "no"

  commerce-service:
    build:
      context: .
      dockerfile: services/commerce-service/Dockerfile
    image: marketplace/commerce-service:local
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@commerce-db:5432/${POSTGRES_DB:-marketplace_commerce}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-marketplace-user-service}
      ORDER_RATE_LIMIT: ${ORDER_RATE_LIMIT:-1m}
    ports:
      - "8080:8080"
    depends_on:
      commerce-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  user-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB:-marketplace_user}
      POSTGRES_USER: ${USER_POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:-marketplace}
    ports:
      - "${USER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  user-migrations:
    image: redgate/flyway:13.10.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://user-db:5432/${USER_POSTGRES_DB:-marketplace_user}
      FLYWAY_USER: ${USER_POSTGRES_USER:-marketplace}
      FLYWAY_PASSWORD: ${USER_POSTGRES_PASSWORD:-marketplace}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./services/user-service/migrations:/flyway/sql:ro
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: marketplace/user-service:local
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${USER_POSTGRES_USER:-marketplace}:${USER_POSTGRES_PASSWORD:-marketplace}@user-db:5432/${USER_POSTGRES_DB:-marketplace_user}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-marketplace-user-service}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-20m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-336h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      user-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s
    restart: unless-stopped

volumes:
  commerce-db-data:
  user-db-data:
