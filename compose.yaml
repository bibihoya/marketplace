services:
  commerce-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - commerce-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  commerce-migrations:
    image: redgate/flyway:13.10.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://commerce-db:5432/${POSTGRES_DB:-marketplace_commerce}
      FLYWAY_USER: ${POSTGRES_USER:-marketplace}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./services/commerce-service/migrations:/flyway/sql:ro
    depends_on:
      commerce-db:
        condition: service_healthy
    restart: "no"

  commerce-service:
    build:
      context: .
      dockerfile: services/commerce-service/Dockerfile
    image: marketplace/commerce-service:local
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      commerce-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s
    restart: unless-stopped

volumes:
  commerce-db-data:
