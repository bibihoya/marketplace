services:
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: marketplace/catalog-service:local
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s
    restart: unless-stopped
