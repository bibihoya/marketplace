        min_order_amount:
          type: number
          format: decimal
          x-go-type: float64
          minimum: 0
          multipleOf: 0.01
        max_uses:
          type: integer
          format: int32
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true

    PromoCodeResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - discount_type
        - discount_value
        - min_order_amount
        - max_uses
        - current_uses
        - valid_from
        - valid_until
        - active
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        discount_type:
          $ref: "#/components/schemas/DiscountType"
        discount_value:
          type: number
          format: decimal
          x-go-type: float64
          readOnly: true
        min_order_amount:
          type: number
          format: decimal
          x-go-type: float64
          readOnly: true
        max_uses:
          type: integer
          format: int32
          readOnly: true
        current_uses:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
        valid_from:
          type: string
          format: date-time
          readOnly: true
        valid_until:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true

    ErrorCode:
      type: string
      enum:
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - PROMO_CODE_ALREADY_EXISTS
        - ORDER_OWNERSHIP_VIOLATION
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - ACCESS_DENIED
        - EMAIL_ALREADY_EXISTS
        - INVALID_CREDENTIALS
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, message]
